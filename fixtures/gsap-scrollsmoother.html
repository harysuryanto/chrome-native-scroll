<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture — GSAP ScrollSmoother</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #smooth-content { height: 3800px; padding: 24px; background: linear-gradient(#f0fdf4, #bbf7d0); }
      #tween-box { width: 60px; height: 60px; background: #16a34a; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div id="smooth-wrapper">
      <div id="smooth-content">
        <h1>GSAP ScrollSmoother Real-Library Fixture</h1>
        <div id="tween-box"></div>
      </div>
    </div>
    <script src="/vendor/gsap/dist/gsap.min.js"></script>
    <script src="/vendor/gsap/dist/ScrollTrigger.min.js"></script>
    <script src="/vendor/gsap/dist/ScrollSmoother.min.js"></script>
    <script>
      window.gsap.registerPlugin(window.ScrollTrigger, window.ScrollSmoother);
      window.ScrollSmoother.create({
        wrapper: '#smooth-wrapper',
        content: '#smooth-content',
        smooth: 1.5,
      });
      // Unrelated GSAP tween must continue running unaffected.
      window.__unrelatedTweenDone = false;
      window.gsap.to('#tween-box', {
        x: 120,
        duration: 0.2,
        onComplete: () => {
          window.__unrelatedTweenDone = true;
        },
      });
    </script>
  </body>
</html>
