<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>NativeScroll</title>
  </head>
  <body>
    <main class="panel popup" aria-labelledby="title">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">↕</div>
        <div class="brand-copy">
          <h1 id="title">NativeScroll</h1>
          <p class="tagline">Back to native scrolling.</p>
        </div>
      </header>

      <section class="card" aria-label="Global controls">
        <label class="setting">
          <span>Enable NativeScroll</span>
          <input id="enabled" type="checkbox" role="switch" disabled />
        </label>
      </section>

      <section class="card" aria-label="Current website">
        <div class="site-row">
          <span class="site-label">Current site</span>
          <span id="site-badge" class="badge" data-state="neutral">Checking…</span>
        </div>
        <p class="site-host" id="current-site" aria-live="polite">Checking current site…</p>
        <p class="site-detail" id="site-detail" aria-live="polite"></p>
        <p id="physics-indicator" class="physics-banner" hidden></p>
        <label class="setting">
          <span>Enable on this site</span>
          <input id="site-enabled" type="checkbox" role="switch" disabled />
        </label>
        <div class="mode-section">
          <span class="site-label">Site mode</span>
          <div id="site-mode-cards" class="mode-cards" role="radiogroup" aria-label="Site mode">
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="default" disabled>
              <span class="mode-card-title" id="mode-default-title">Use default</span>
              <span class="mode-card-desc">Follows your global default operating mode.</span>
            </button>
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="auto" disabled>
              <span class="mode-card-title" id="mode-auto-title">Auto (Least Risk)</span>
              <span class="mode-card-desc">Detects what works and picks the lowest-risk mode (Native → Compatibility → Strict).</span>
            </button>
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="native" disabled>
              <span class="mode-card-title">Native</span>
              <span class="mode-card-desc">CSS smooth-scroll override and explicit smooth JS APIs only.</span>
            </button>
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="compatibility" disabled>
              <span class="mode-card-title">Compatibility</span>
              <span class="mode-card-desc">Adds verified adapters for Lenis, GSAP ScrollSmoother, and Locomotive Scroll.</span>
            </button>
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="strict" disabled>
              <span class="mode-card-title">Strict (Experimental)</span>
              <span class="mode-card-desc">Adds conservative root wheel-hijack guard while preserving maps, zoom, and editors.</span>
            </button>
          </div>
        </div>
        <p id="strict-warning" class="warning" hidden>
          Strict mode experimentally guards root wheel hijackers and may affect wheel-driven carousels.
        </p>
      </section>

      <details id="diagnostics-panel" class="card" hidden>
        <summary class="diag-summary">Site diagnostics</summary>
        <ul id="diagnostics-list" class="diag-list"></ul>
      </details>

      <p id="message" class="status" role="status" aria-live="polite"></p>

      <footer class="footer">
        <button id="settings" type="button">Open settings</button>
        <p id="version" class="version">v0.1.0</p>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
