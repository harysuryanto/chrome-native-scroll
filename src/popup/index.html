<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>NativeScroll</title>
  </head>
  <body>
    <main class="panel" aria-labelledby="title">
      <div class="brand-mark" aria-hidden="true">↕</div>
      <h1 id="title">NativeScroll</h1>
      <p class="tagline">Back to native scrolling.</p>
      <p class="notice">Settings are persistent. Scrolling interception arrives in subsequent issues.</p>
      <label class="setting"><span>Enable NativeScroll</span><input id="enabled" type="checkbox" disabled /></label>
      <p class="status" id="current-site" aria-live="polite">Checking current site…</p>
      <label class="setting"><span>Enable on this site</span><input id="site-enabled" type="checkbox" disabled /></label>
      <p id="message" class="status" role="status"></p>
      <button id="settings" type="button">Open settings</button>
      <p class="version">v0.1.0 · Settings foundation</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
