<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>NativeScroll</title>
  </head>
  <body>
    <main class="panel popup" aria-labelledby="title">
      <!-- Chrome Extension Header -->
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 7.5L12 2.5L18 7.5" stroke="var(--color-sys-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="8" y1="12" x2="16" y2="12" stroke="var(--color-sys-primary)" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 16.5L12 21.5L18 16.5" stroke="var(--color-sys-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-copy">
          <h1 id="title">NativeScroll</h1>
          <p class="tagline">Back to native scrolling.</p>
        </div>
      </header>

      <!-- Global Master Switch (Chrome Settings Row) -->
      <section class="card" aria-label="Global controls">
        <label class="setting" for="enabled">
          <div class="setting-content">
            <span class="setting-title">Enable NativeScroll</span>
            <span class="setting-desc">Active scroll normalization across all sites</span>
          </div>
          <div class="switch">
            <input id="enabled" type="checkbox" role="switch" disabled />
            <span class="switch-slider" aria-hidden="true"></span>
          </div>
        </label>
      </section>

      <!-- Current Website Cockpit -->
      <section class="card" aria-label="Current website">
        <div class="site-row">
          <span class="site-label">Current site</span>
          <span id="site-badge" class="badge" data-state="neutral">Checking…</span>
        </div>

        <div class="site-host-wrap">
          <svg class="site-host-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="6.5"/>
            <line x1="1.5" y1="8" x2="14.5" y2="8"/>
            <path d="M8 1.5a10 10 0 0 1 3 6.5 10 10 0 0 1-3 6.5 10 10 0 0 1-3-6.5 10 10 0 0 1 3-6.5z"/>
          </svg>
          <p class="site-host" id="current-site" aria-live="polite">Checking current site…</p>
        </div>

        <p class="site-detail" id="site-detail" aria-live="polite"></p>

        <p id="physics-indicator" class="physics-banner" hidden></p>

        <label class="setting" for="site-enabled">
          <div class="setting-content">
            <span class="setting-title">Enable on this site</span>
            <span class="setting-desc">Normalize scroll behavior on this host</span>
          </div>
          <div class="switch">
            <input id="site-enabled" type="checkbox" role="switch" disabled />
            <span class="switch-slider" aria-hidden="true"></span>
          </div>
        </label>

        <!-- Card-based Site Mode Selection (Chrome Native Style) -->
        <div class="mode-section">
          <span class="site-label">Site mode</span>
          <div id="site-mode-cards" class="mode-cards" role="radiogroup" aria-label="Site mode">
            <!-- Default -->
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="default" disabled>
              <div class="mode-card-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="8" cy="8" r="2.8"/>
                  <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2"/>
                </svg>
              </div>
              <div class="mode-card-body">
                <div class="mode-card-header">
                  <span class="mode-card-title" id="mode-default-title">Use default</span>
                  <span class="mode-card-tag">Profile</span>
                </div>
                <span class="mode-card-desc">Follows your global default operating mode.</span>
              </div>
              <div class="mode-card-radio" aria-hidden="true"></div>
            </button>

            <!-- Auto -->
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="auto" disabled>
              <div class="mode-card-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8.5 1.5L2.5 9h5l-1 5.5L13.5 7h-5l1-5.5z"/>
                </svg>
              </div>
              <div class="mode-card-body">
                <div class="mode-card-header">
                  <span class="mode-card-title" id="mode-auto-title">Auto (Least Risk)</span>
                  <span class="mode-card-tag">Adaptive</span>
                </div>
                <span class="mode-card-desc">Detects what works and picks the lowest-risk mode (Native → Compatibility → Strict).</span>
              </div>
              <div class="mode-card-radio" aria-hidden="true"></div>
            </button>

            <!-- Native -->
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="native" disabled>
              <div class="mode-card-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.5 5.5L8 2l3.5 3.5M4.5 10.5L8 14l3.5-3.5"/>
                  <line x1="8" y1="5.5" x2="8" y2="10.5"/>
                </svg>
              </div>
              <div class="mode-card-body">
                <div class="mode-card-header">
                  <span class="mode-card-title">Native</span>
                  <span class="mode-card-tag">Minimal</span>
                </div>
                <span class="mode-card-desc">CSS smooth-scroll override and explicit smooth JS APIs only.</span>
              </div>
              <div class="mode-card-radio" aria-hidden="true"></div>
            </button>

            <!-- Compatibility -->
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="compatibility" disabled>
              <div class="mode-card-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="5" width="12" height="6" rx="2"/>
                  <path d="M6 5V2M10 5V2M6 11v3M10 11v3"/>
                </svg>
              </div>
              <div class="mode-card-body">
                <div class="mode-card-header">
                  <span class="mode-card-title">Compatibility</span>
                  <span class="mode-card-tag">Adapters</span>
                </div>
                <span class="mode-card-desc">Adds verified adapters for Lenis, GSAP ScrollSmoother, and Locomotive Scroll.</span>
              </div>
              <div class="mode-card-radio" aria-hidden="true"></div>
            </button>

            <!-- Strict -->
            <button type="button" class="mode-card" role="radio" aria-checked="false" data-mode="strict" disabled>
              <div class="mode-card-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 1.5l5.5 2.5v4c0 3.5-2.5 6-5.5 7-3-1-5.5-3.5-5.5-7V4L8 1.5z"/>
                </svg>
              </div>
              <div class="mode-card-body">
                <div class="mode-card-header">
                  <span class="mode-card-title">Strict (Experimental)</span>
                  <span class="mode-card-tag">Guarded</span>
                </div>
                <span class="mode-card-desc">Adds conservative root wheel-hijack guard while preserving maps, zoom, and editors.</span>
              </div>
              <div class="mode-card-radio" aria-hidden="true"></div>
            </button>
          </div>
        </div>

        <p id="strict-warning" class="warning" hidden>
          Strict mode experimentally guards root wheel hijackers and may affect wheel-driven carousels.
        </p>
      </section>

      <!-- Diagnostics Panel -->
      <details id="diagnostics-panel" class="card diag-card" hidden>
        <summary class="diag-summary">
          <div class="diag-summary-inner">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
              <path d="M2.5 3h11M2.5 8h11M2.5 13h11"/>
            </svg>
            <span>Site diagnostics</span>
          </div>
          <svg class="diag-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3.5L10.5 8 6 12.5"/>
          </svg>
        </summary>
        <ul id="diagnostics-list" class="diag-list"></ul>
      </details>

      <p id="message" class="status" role="status" aria-live="polite"></p>

      <!-- Footer -->
      <footer class="footer">
        <button id="settings" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
            <circle cx="8" cy="8" r="2.5"/>
            <path d="M13.5 8a5.5 5.5 0 0 0-.1-1l1.4-1.1-1.3-2.3-1.7.6a5.6 5.6 0 0 0-1.7-1L9.8 1.5H7.2L7 3.2a5.6 5.6 0 0 0-1.7 1L3.6 3.6 2.3 5.9l1.4 1.1a5.5 5.5 0 0 0 0 2L2.3 10.1l1.3 2.3 1.7-.6a5.6 5.6 0 0 0 1.7 1l.2 1.7h2.6l.3-1.7a5.6 5.6 0 0 0 1.7-1l1.7.6 1.3-2.3-1.4-1.1c.1-.3.1-.7.1-1z"/>
          </svg>
          <span>Settings</span>
        </button>
        <p id="version" class="version">v0.1.0</p>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
