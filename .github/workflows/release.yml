name: Release NativeScroll

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps
      - name: Run Playwright extension E2E tests
        run: bun run test:e2e
      - name: Package & verify release ZIP
        run: bun run package
      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum nativescroll-*.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" release/nativescroll-*.zip release/SHA256SUMS.txt \
            --title "NativeScroll $TAG" \
            --generate-notes \
            $PRERELEASE_FLAG
