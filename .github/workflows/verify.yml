name: Verify NativeScroll

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Verify built manifest and scripts
        run: |
          bun -e 'const m=await Bun.file("dist/manifest.json").json(); for (const f of [m.action.default_popup,m.options_page,m.background.service_worker,...m.content_scripts.flatMap(s=>s.js)]) {if (!(await Bun.file("dist/"+f).exists())) throw new Error("Missing built file: "+f)}'
      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps
      - name: Run Playwright extension E2E tests
        run: bun run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload installable Chrome extension build
        uses: actions/upload-artifact@v4
        with:
          name: nativescroll-chrome-extension
          path: dist/
          if-no-files-found: error
          retention-days: 14
